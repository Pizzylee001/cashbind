<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132234"/>
      <stop offset="100%" stop-color="#0B131D"/>
    </linearGradient>
    <linearGradient id="emerald" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1FD18B"/>
      <stop offset="100%" stop-color="#0A7E4F"/>
    </linearGradient>
  </defs>

  <!-- Deep Slate Notary Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" stroke="#1E3148" stroke-width="4"/>

  <!-- Subtle outer registration ring -->
  <circle cx="256" cy="256" r="196" stroke="#28405B" stroke-width="5" stroke-dasharray="10 14"/>

  <!-- Outer Dual BCH Key Arcs (Emerald Notary) -->
  <path d="M 256 76 A 180 180 0 0 1 436 256" stroke="url(#emerald)" stroke-width="32" stroke-linecap="square"/>
  <path d="M 256 436 A 180 180 0 0 1 76 256" stroke="url(#emerald)" stroke-width="32" stroke-linecap="square"/>

  <!-- Inner Dual Nostr Key Arcs (Crisp Silver-White) -->
  <path d="M 256 128 A 128 128 0 0 0 128 256" stroke="#F1F5F9" stroke-width="24" stroke-linecap="square"/>
  <path d="M 256 384 A 128 128 0 0 0 384 256" stroke="#F1F5F9" stroke-width="24" stroke-linecap="square"/>

  <!-- Center Notary Seal Core -->
  <circle cx="256" cy="256" r="76" fill="#0A7E4F"/>
  <circle cx="256" cy="256" r="76" stroke="#1FD18B" stroke-width="8"/>

  <!-- Crisp Verified Notary Checkmark -->
  <path d="M 222 258 L 246 282 L 294 230" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
